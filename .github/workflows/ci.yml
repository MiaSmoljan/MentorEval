name: CI - User Profile Tests

on:
  push:
    branches: [ feature/user-profile ]
  pull_request:
    branches: [ feature/user-profile ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore main project
      run: dotnet restore MentorEval/MentorEval.csproj

    - name: Restore test project
      run: dotnet restore MentorEval.Tests/MentorEval.Tests.csproj

    - name: Build main project
      run: dotnet build MentorEval/MentorEval.csproj --no-restore

    - name: Build test project
      run: dotnet build MentorEval.Tests/MentorEval.Tests.csproj --no-restore

    - name: Test with Coverage
      run: dotnet test MentorEval.Tests/MentorEval.Tests.csproj --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage